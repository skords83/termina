server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    # Oeffentlicher, unauthentifizierter ICS-Abo-Link fuer "Mit Oma + Opa teilen"
    # (siehe backend/src/app/api/public_ics.py). Bewusst ohne Authorization-Header-
    # Weiterleitung - der Endpoint braucht kein Login, nur das Token in der URL.
    location /public/ {
        proxy_pass http://backend:8000/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}